# Two participants' agents and two stand-in gateways, on one laptop.
#
#   docker compose -f harness/docker-compose.yml up --build -d
#   ./harness/demo.sh            # subscribe, approve, post, read
#
# Nothing here is a secret: the keys are fixed, published and harness-only.
name: labagent-harness

x-agent: &agent
  build: { context: .., dockerfile: deploy/Dockerfile, target: harness }
  environment: &agent-env
    LABAGENT_RESOLVE_HOSTS: "alice-gw.test=http://alice-gw:8000,bob-gw.test=http://bob-gw:8000"
    LABAGENT_OUTBOX_INTERVAL: "1"

services:
  alice:
    <<: *agent
    environment:
      <<: *agent-env
      LABAGENT_NAME: "Alice's agent"
      LABAGENT_PUBLIC_URL: "http://alice-gw.test/a2a/"
      LABAGENT_API_KEYS: "harness-alice-inbound-key-0000000000000000000000000000"
    volumes: ["./peers/alice.toml:/app/peers.toml:ro", "alice-data:/app/data"]

  bob:
    <<: *agent
    environment:
      <<: *agent-env
      LABAGENT_NAME: "Bob's agent"
      LABAGENT_PUBLIC_URL: "http://bob-gw.test/a2a/"
      LABAGENT_API_KEYS: "harness-bob-inbound-key-00000000000000000000000000000000"
    volumes: ["./peers/bob.toml:/app/peers.toml:ro", "bob-data:/app/data"]

  alice-gw:
    <<: *agent
    command: ["python", "-m", "harness.pretend_gateway"]
    environment:
      GW_SEED: alice
      GW_HOST: alice-gw.test
      GW_ROUTES: '{"bob": {"url": "http://bob:8080/", "key": "harness-bob-inbound-key-00000000000000000000000000000000"}}'
    healthcheck: { disable: true }

  bob-gw:
    <<: *agent
    command: ["python", "-m", "harness.pretend_gateway"]
    environment:
      GW_SEED: bob
      GW_HOST: bob-gw.test
      GW_ROUTES: '{"alice": {"url": "http://alice:8080/", "key": "harness-alice-inbound-key-0000000000000000000000000000"}}'
    healthcheck: { disable: true }

volumes:
  alice-data:
  bob-data:
