# Your agent, and a tunnel your gateway can reach it through.
#
#   docker compose -f deploy/docker-compose.yml up --build -d
#   ./deploy/check.sh            # the tunnel and the doors behave
#
# See deploy/DEPLOY.md. Reads ../.env and ../peers.toml; neither is committed.
#
# The tunnel is a Cloudflare *quick* tunnel: no account, and a new
# `*.trycloudflare.com` hostname every time the container starts. Each new
# hostname has to be put into your surface's external target again. That is
# fine for a first look and wrong for anything you leave running: see
# DEPLOY.md §2 for hosting that stays up.
name: labagent

services:
  agent:
    build: { context: .., dockerfile: deploy/Dockerfile, target: agent }
    env_file: ../.env
    environment:
      # Paths inside the container, whatever .env says for running on the host.
      LABAGENT_DB: /app/data/labagent.sqlite3
      LABAGENT_PEERS: /app/peers.toml
    volumes:
      - ../peers.toml:/app/peers.toml:ro
      - agent-data:/app/data
      # Written only while LABAGENT_CAPTURE_DIR=/app/captures is set in .env.
      - ../captures:/app/captures
    # No `ports:`. Nothing on this machine or the network reaches the agent
    # except through the tunnel. The owner MCP server (:8081, owner key) is not
    # tunnelled yet: `docker compose -f deploy/docker-compose.yml exec agent python -m labagent …`.
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:2025.9.1
    # The public A2A port only. The owner MCP port gets its own route and
    # access point when the agent is hosted to stay up (see DEPLOY.md).
    command: ["tunnel", "--no-autoupdate", "--url", "http://agent:8080"]
    depends_on: [agent]
    restart: unless-stopped

volumes:
  agent-data:
